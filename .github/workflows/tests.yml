# Runs the fast tests (unit tests + the regression test from saved Omnipose masks) on every push and pull
# request, on Linux and Windows (Java 11 for the Bio-Formats test via setup-java). The slow tests (Omnipose, bud model) run on your own machine: `pytest -m slow`.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            constraints: constraints/linux.txt
          - os: windows-latest
            constraints: constraints/windows.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4           # Java 11 for Bio-Formats, as the installers' conda env (openjdk=11)
        with:
          distribution: temurin
          java-version: "11"
      - name: Install PyTorch (CPU build, much smaller than the default CUDA build; version from the constraints)
        run: pip install -c ${{ matrix.constraints }} torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install buddy (the pinned versions of constraints/, as the installers do; Omnipose is not needed here)
        run: pip install -c ${{ matrix.constraints }} -e ".[test]"
      - name: Lint (ruff)
        run: ruff check buddy tests
      - name: Bio-Formats smoke test (Java starts, the jar is found; torch imported first, as in the tests)
        run: python -c "import torch; from buddy.reading.vsi import bioformats_version; print('Bio-Formats', bioformats_version())"
      - name: Download the test data (with the workflow's token, so a private repository works too)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download test-data-v3 --pattern field_A.zip --dir "$RUNNER_TEMP" --clobber
          rm -rf tests/data && mkdir -p tests/data
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('tests/data')" "$RUNNER_TEMP/field_A.zip"
          echo "test data:"; ls -l "$RUNNER_TEMP/field_A.zip"; find tests/data/field_A/reference -type d
      - name: Fast tests
        env:
          BUDDY_REQUIRE_TEST_DATA: "1"
        run: pytest -m "not slow" --durations=10

# Runs the fast tests (unit tests + the regression test from saved Omnipose masks) on every push and pull
# request, on Linux and Windows. The slow tests (Omnipose, bud model) run on your own machine: `pytest -m slow`.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install PyTorch (CPU build, much smaller than the default CUDA build)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install buddy
        run: pip install -e ".[test]"
      - name: Lint (ruff)
        run: ruff check buddy tests
      - name: Cache the test data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-v1
      - name: Fast tests
        run: pytest -m "not slow" --durations=10

# Runs the fast tests (unit tests + the regression test from saved Omnipose masks) on every push and pull
# request, on Linux and Windows. The slow tests (Omnipose, bud model) run on your own machine: `pytest -m slow`.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install PyTorch (CPU build, much smaller than the default CUDA build)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install buddy
        run: pip install -e ".[test]"
      - name: Lint (ruff)
        run: ruff check buddy tests
      - name: Download the test data (with the workflow's token, so a private repository works too)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download test-data-v2 --pattern field_A.zip --dir "$RUNNER_TEMP" --clobber
          rm -rf tests/data && mkdir -p tests/data
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('tests/data')" "$RUNNER_TEMP/field_A.zip"
          echo "test data:"; ls -l "$RUNNER_TEMP/field_A.zip"; find tests/data/field_A/reference -type d
      - name: Fast tests
        env:
          BUDDY_REQUIRE_TEST_DATA: "1"
        run: pytest -m "not slow" --durations=10

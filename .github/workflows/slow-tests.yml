# The slow tests: Omnipose segmentation (step 2) and the bud model's prediction on the test field, compared with
# the reference in the test-data release. On the CPU (GitHub has no GPU): about 10-20 minutes per system.
# Start by hand: Actions -> slow tests -> Run workflow -> choose the system(s).
# Once a week (Monday night) it runs on both Linux and Windows.
name: slow tests

on:
  workflow_dispatch:
    inputs:
      system:
        description: "Which system(s) to test on"
        type: choice
        options: [both, linux, windows]
        default: both
  schedule:
    - cron: "0 3 * * 1"      # Mondays 03:00 UTC; delete these two lines to run it only by hand

jobs:
  slow-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false        # one system failing does not cancel the other
      matrix:
        # the weekly run has no input -> both
        os: ${{ fromJSON(inputs.system == 'linux' && '["ubuntu-latest"]' || inputs.system == 'windows' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install PyTorch (CPU build)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install buddy
        run: pip install -e ".[test]"
      - name: Cache the model weights (bud model from release bud-models, Omnipose models)
        uses: actions/cache@v4
        with:
          path: |
            buddy/models/*.pt
            ~/.cellpose/models
          key: models-bud-models-${{ runner.os }}
      - name: Download the test data and the bud-model weights (with the workflow's token, so a private repository works too)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download test-data-v2 --pattern field_A.zip --dir "$RUNNER_TEMP" --clobber
          rm -rf tests/data && mkdir -p tests/data
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('tests/data')" "$RUNNER_TEMP/field_A.zip"
          echo "test data:"; ls -l "$RUNNER_TEMP/field_A.zip"; find tests/data/field_A/reference -type d
          gh release download bud-models --pattern "*.pt" --dir buddy/models --skip-existing
      - name: Slow tests (Omnipose + bud model)
        env:
          BUDDY_REQUIRE_TEST_DATA: "1"
        run: pytest -m slow -v --durations=0

name: buddy
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # Everything else (buddy + its deps, including omnipose and big-fish)
  # is installed by pip from pyproject.toml. Run from the repo root:
  #   conda env create -f environment.yml
  #   conda activate buddy
  # then install the code:
  #   pip install -e ".[test,napari]"
  #
  # Java is NOT listed here on purpose: bioio-bioformats fetches a JRE +
  # Maven automatically via cjdk on first run (you'll see
  # "Fetching zulu-jre:11 using cjdk..." the first time you read a .vsi).
  # If you're offline or behind a strict proxy, uncomment the next two
  # lines to provide Java from conda instead of letting cjdk download it:
  # - openjdk=11
  # - maven

name: buddy
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # Everything else (buddy + its deps, including omnipose and big-fish)
  # is installed by pip from pyproject.toml. Run from the repo root:
  #   conda env create -f environment.yml
  #   conda activate buddy
  # then install the code:
  #   pip install -e ".[test,napari]"
  #
  # Java + Maven for reading .vsi files (Bio-Formats). From conda-forge, so
  # nothing is downloaded on the first read (that download fails offline or
  # behind a proxy). Activating the env sets JAVA_HOME.
  - openjdk=11
  - maven

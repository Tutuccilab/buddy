[pytest]
testpaths = tests
log_cli = false
log_level = WARNING
markers =
    slow: needs Omnipose, a GPU or the bud-model weights (minutes); skipped in CI with -m "not slow"
# third-party warnings a buddy user cannot act on (pytest resets the filters set in buddy/__init__.py)
filterwarnings =
    ignore:.*json_encoders.*:DeprecationWarning
    ignore::FutureWarning:bigfish
    ignore:chan to seg' has value range of ZERO
    ignore:.*torch.load.*weights_only.*:FutureWarning
    ignore:.*is a low contrast image:UserWarning
    ignore::DeprecationWarning:aicsimageio

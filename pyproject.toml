[project]
name = "buddy"
version = "0.6.0"
authors = [
  {name = "LaToya Vanderbling", email = "latoya.vanderbling@gmail.com"},
]
description = "Wrapper for BigFish spot detection package"
readme = "README.md"
license = "BSD-3-Clause"        # see LICENSE

# 3.12 is what the installers and the constraint files use (since 0.5.2; 3.10 before). 3.13: PyTorch 2.5.1 has no
# wheels for it.
requires-python = ">=3.10,<3.13"

dependencies = [
    # the constraints pin numpy 1.26 (the version of the paper's runs); numpy 2 gives the same masks and spots (tested
    # with 0.5.2), so it is allowed here
    "numpy<3",
    "scipy",
    "scikit-image",
    "scikit-learn",     # Big-FISH and Omnipose use it
    "big-fish",         # spot detection
    # reading .vsi (Olympus) through Bio-Formats: the jar of Bio-Formats 6.7.0 (+ JPype1), buddy/reading/vsi.py;
    # Java itself comes from conda (installers). Pinned: the Bio-Formats version decides how a .vsi is parsed.
    "bioformats_jar==6.7.0.post2",
    "tifffile",         # OME-TIFF channel stacks, TIFF input
    "pandas",           # per-cell tables; notebooks 02-05
    "matplotlib",
    "seaborn",          # notebook 02
    "psutil",           # parallel step 1: number of workers from free memory
    # PyTorch, pinned: Omnipose, the bud model and GPU spot detection are tested with this version. On Linux and
    # Windows the installer takes the matching CUDA build; macOS is CPU only.
    "torch==2.5.1",
    "torchvision==0.20.1",
    # the bud model's U-Net (buddy/buds/unet.py) is plain torch + torchvision's resnet34
    # Omnipose itself is NOT listed here: "omnipose" on PyPI pulls in ~100 packages (aicsimageio, networkit, dask-image,
    # ...) of which segmentation needs about fifteen. The installers do pip install --no-deps omnipose (version in
    # constraints/; its wheel includes cellpose_omni - the separate cellpose-omni package on PyPI is older and must NOT
    # be installed next to it), and these are what importing and running its segmentation code needs (found by
    # importing cellpose_omni.models and segmenting the test field in a bare environment):
    "numba",
    "edt",
    "fastremap",
    "mgen",
    "dbscan",
    "ncolor",
    "mahotas",
    "dask",
    "opencv-python-headless",
    "imagecodecs",
    "natsort",
    "tqdm",
    "torchvf",
    "cmap",
    "colour-science",
    "pyinstrument",      # the last three are imported by omnipose at module level, unused by segmentation
    # (aicsimageio is imported by cellpose_omni.io too but not needed: buddy/segmentation/masks.py stands in for it)
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Install with: pip install -e ".[test]"
test = ["pytest", "ruff"]
# The napari viewer + Qt backend. Installed INTO the env so `python -m napari`
# launches from here instead of a base-conda napari.
napari = [
    "napari[pyqt6]; sys_platform != 'linux'",
    "napari[pyqt5]; sys_platform == 'linux'",    # Qt6 does not start on every Linux desktop
]
# Jupyter, so `python -m notebook` runs the pipeline notebooks from this env
# (and never falls back to a broken base-conda Jupyter).
notebooks = ["notebook"]
# ONLY for the archived CNN bud-annotator trial (archive/). Heavy (PyTorch);
# don't install unless you're reviving that experiment. For CUDA builds of
# torch you may need the PyTorch index; CPU wheels install from PyPI fine.
cnn = ["torch", "torchvision", "segmentation-models-pytorch", "tqdm"]

[project.urls]
Homepage = "https://github.com/LaToyaVanderB/buddy"

[build-system]
requires = ["setuptools>=77.0"]   # 77: the license = "..." field
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

# only the buddy package (and its sub-packages); notebooks/ and tests/ are not part of the install
[tool.setuptools.packages.find]
include = ["buddy*"]
# If you prefer the version to live in buddy/__init__.py, delete the
# static `version = "0.0.1"` above and uncomment the two blocks below.
# Make sure buddy/__init__.py actually defines __version__ first, or
# the build will fail — which is one of the current install snags.
# [tool.setuptools.dynamic]
# version = {attr = "buddy.__init__.__version__"}

[tool.ruff]
line-length = 130
target-version = "py310"
exclude = ["config_files", "*.ipynb"]  # notebooks: repeated imports between cells are normal

[tool.ruff.lint]
# E = errors, F = pyflakes (undefined names, unused imports), B = likely bugs, I = import order
select = ["E", "F", "B", "I"]
ignore = ["E501", "E702", "E741", "E731", "E402", "B006", "B007", "B008", "B905", "B028"]
